<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTYN AI</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding-top: 30px; margin: 0; }
        .chat-box { background: white; width: 90%; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        #messages { height: 50vh; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .msg { margin: 5px 0; padding: 8px 12px; border-radius: 15px; max-width: 85%; word-wrap: break-word; }
        .user { background: #007bff; color: white; margin-left: auto; }
        .ai { background: #e9ecef; color: black; margin-right: auto; }
        .input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="chat-box">
    <h2>ALTYN AI 🧠</h2>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Суроо жазыңыз..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Жөнөтүү</button>
    </div>
</div>

<script>
    const SERVER_URL = "https://altyn-ai-fqyt.onrender.com/chat"; 

    function addMessage(text, sender) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', sender);
        msgDiv.innerText = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        addMessage("...", 'ai');

        try {
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            const messagesDiv = document.getElementById('messages');
            messagesDiv.removeChild(messagesDiv.lastChild); 
            addMessage(data.reply, 'ai');
        } catch (error) {
            addMessage("Сервер менен байланыш жок.", 'ai');
        }
    }
</script>
</body>
</html>
